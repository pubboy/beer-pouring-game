<!DOCTYPE html>
<html lang="ko">

<title>CRAFT PEEPEE - 16BIT POUR</title>
<style>

html,body{width:100%;height:100%;overflow:hidden;background:#000;overscroll-behavior:none;position:fixed;top:0;left:0}
#wrap{position:absolute;left:50%;top:0;transform:translateX(-50%);width:100vw;height:100vh;height:100dvh;background:#000;touch-action:none}

<body>
<div id="wrap"><canvas id="c" width="240" height="426"></canvas></div>
<script>
(()=>{
'use strict';
/* ====================================================================
   CRAFT PEEPEE - 16bit pub pour game (single file, 240 x ~426 virtual px)
   ==================================================================== */
const W=240; let H=426;
const TOP_H=58, TAP_H=168, CNT_H=26, LANES=4, LW=W/LANES, ROUND_T=45;
const BASE_RATE=0.19;      // 잔 용량 대비 초당 채움 비율 (1배속). 낮출수록 PERFECT가 쉬워짐
const FOAM_BURST=0.3;      // 이 시간보다 짧게 누르면 거품만 나옴
const MILKO_WAIT=0.5;      // 밀코: 이 시간 동안 안 누르면 판정
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const wrap=document.getElementById('wrap');
let counterY=0, tapTop=0, baseY=0, grain=[];

/* ---------------- helpers ---------------- */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick=a=>a[Math.random()*a.length|0];
const rnd=(a,b)=>a+Math.random()*(b-a);
const fmt=n=>String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,',');
const won=n=>'₩'+fmt(n);
function shade(c,a){
  const n=parseInt(c.slice(1),16); let r=n>>16,g=(n>>8)&255,b=n&255;
  if(a<0){const k=1+a; r*=k;g*=k;b*=k;} else {r+=(255-r)*a;g+=(255-g)*a;b+=(255-b)*a;}
  return '#'+((1<<24)|(Math.round(r)<<16)|(Math.round(g)<<8)|Math.round(b)).toString(16).slice(1);
}
function R(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}
function box(x,y,w,h,f,o){o=o||'#000';R(x-1,y-1,w+2,h+2,o);R(x,y,w,h,f);}
function ell(cx,cy,rx,ry,c){
  ctx.fillStyle=c;
  for(let dy=-ry;dy<=ry;dy++){
    const w=Math.round(rx*Math.sqrt(Math.max(0,1-(dy*dy)/((ry+0.5)*(ry+0.5)))));
    ctx.fillRect(Math.round(cx-w),Math.round(cy+dy),w*2+1,1);
  }
}
function ellO(cx,cy,rx,ry,c,o){ell(cx,cy,rx+1,ry+1,o||'#000');ell(cx,cy,rx,ry,c);}
function pix(list,c){ctx.fillStyle=c;for(const p of list)ctx.fillRect(p[0],p[1],p[2]||1,p[3]||1);}

/* ---------------- 5x7 pixel font ---------------- */
const FD={
A:'0E,11,11,1F,11,11,11',B:'1E,11,11,1E,11,11,1E',C:'0E,11,10,10,10,11,0E',D:'1E,11,11,11,11,11,1E',
E:'1F,10,10,1E,10,10,1F',F:'1F,10,10,1E,10,10,10',G:'0E,11,10,17,11,11,0F',H:'11,11,11,1F,11,11,11',
I:'0E,04,04,04,04,04,0E',J:'07,02,02,02,02,12,0C',K:'11,12,14,18,14,12,11',L:'10,10,10,10,10,10,1F',
M:'11,1B,15,15,11,11,11',N:'11,19,15,13,11,11,11',O:'0E,11,11,11,11,11,0E',P:'1E,11,11,1E,10,10,10',
Q:'0E,11,11,11,15,12,0D',R:'1E,11,11,1E,14,12,11',S:'0F,10,10,0E,01,01,1E',T:'1F,04,04,04,04,04,04',
U:'11,11,11,11,11,11,0E',V:'11,11,11,11,11,0A,04',W:'11,11,11,15,15,1B,11',X:'11,11,0A,04,0A,11,11',
Y:'11,11,0A,04,04,04,04',Z:'1F,01,02,04,08,10,1F',
'0':'0E,11,13,15,19,11,0E','1':'04,0C,04,04,04,04,0E','2':'0E,11,01,02,04,08,1F','3':'1F,02,04,02,01,11,0E',
'4':'02,06,0A,12,1F,02,02','5':'1F,10,1E,01,01,11,0E','6':'06,08,10,1E,11,11,0E','7':'1F,01,02,04,08,08,08',
'8':'0E,11,11,0E,11,11,0E','9':'0E,11,11,0F,01,02,0C',
'+':'00,04,04,1F,04,04,00','-':'00,00,00,1F,00,00,00','.':'00,00,00,00,00,0C,0C',',':'00,00,00,00,0C,04,08',
'$':'04,0F,14,0E,05,1E,04',':':'00,0C,0C,00,0C,0C,00','/':'01,01,02,04,08,10,10','!':'04,04,04,04,04,00,04',
'?':'0E,11,01,02,04,00,04','%':'18,19,02,04,08,13,03','=':'00,00,1F,00,1F,00,00',' ':'00,00,00,00,00,00,00',
'₩':'11,11,1F,15,1F,0A,0A'
};
const GL={}; for(const k in FD) GL[k]=FD[k].split(',').map(h=>parseInt(h,16));
function tw(str,s){return str.length*6*s-s;}
function text(str,x,y,col,s,align){
  s=s||1; str=String(str).toUpperCase();
  const w=tw(str,s);
  if(align==='c') x-=w>>1; else if(align==='r') x-=w;
  x=Math.round(x); y=Math.round(y); ctx.fillStyle=col;
  for(let i=0;i<str.length;i++){
    const g=GL[str[i]]; if(!g) continue;
    for(let r=0;r<7;r++){const bits=g[r]; if(!bits) continue;
      for(let c=0;c<5;c++) if(bits&(16>>c)) ctx.fillRect(x+(i*6+c)*s,y+r*s,s,s);}
  }
  return w;
}
function textO(str,x,y,col,oc,s,align){
  s=s||1; str=String(str); const w=tw(str,s);
  if(align==='c') x-=w>>1; else if(align==='r') x-=w;
  const o=s>=3?2:1;
  for(let dx=-o;dx<=o;dx+=o) for(let dy=-o;dy<=o;dy+=o) if(dx||dy) text(str,x+dx,y+dy,oc,s,'l');
  text(str,x,y,col,s,'l');
}
/* 한글 라벨 (엔딩 화면에서만 사용): 시스템 폰트를 도트화 */
const korCache={};
function korText(str,x,y,col,size,align){
  size=size||9; const key=str+'|'+size+'|'+col; let e=korCache[key];
  if(!e){
    try{
      const font='bold '+size+'px "Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR",sans-serif';
      const m=document.createElement('canvas'), mc=m.getContext('2d'); mc.font=font;
      const w=Math.ceil(mc.measureText(str).width)+2, h=size+4; m.width=w; m.height=h;
      mc.font=font; mc.textBaseline='top'; mc.fillStyle='#fff'; mc.fillText(str,1,1);
      const d=mc.getImageData(0,0,w,h).data;
      const o=document.createElement('canvas'); o.width=w; o.height=h;
      const oc=o.getContext('2d'); oc.fillStyle=col;
      for(let yy=0;yy<h;yy++) for(let xx=0;xx<w;xx++) if(d[(yy*w+xx)*4+3]>100) oc.fillRect(xx,yy,1,1);
      e={c:o,w,h};
    }catch(err){e={c:null,w:str.length*size,h:size};}
    korCache[key]=e;
  }
  if(!e.c) return;
  let dx=x; if(align==='c') dx-=e.w>>1; else if(align==='r') dx-=e.w;
  ctx.drawImage(e.c,Math.round(dx),Math.round(y));
}

/* ---------------- audio (Web Audio: 효과음 / 맥주 따르는 소리 / 8비트 BGM) ---------------- */
let AC=null, sfxBus=null, musBus=null, noiseBuf=null;
let musicOn=true; try{musicOn=localStorage.getItem('cp_music')!=='0';}catch(e){}
function initAudio(){
  try{
    if(!AC){const C=window.AudioContext||window.webkitAudioContext; if(C) AC=new C();}
    if(AC&&AC.state==='suspended') AC.resume();
    if(AC&&!sfxBus){
      sfxBus=AC.createGain(); sfxBus.gain.value=1; sfxBus.connect(AC.destination);
      musBus=AC.createGain(); musBus.gain.value=musicOn?0.5:0; musBus.connect(AC.destination);
      noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
      const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    }
  }catch(e){}
}
function voice(f,t0,dur,type,vol,bus,f2){
  if(!AC) return;
  try{
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'square'; o.frequency.setValueAtTime(f,t0);
    if(f2) o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
    g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g); g.connect(bus||sfxBus||AC.destination); o.start(t0); o.stop(t0+dur+0.03);
  }catch(e){}
}
function tone(f,d,type,v,f2,delay){
  if(!AC) return;
  try{
    const o=AC.createOscillator(),g=AC.createGain(),t0=AC.currentTime+(delay||0);
    o.type=type||'square'; o.frequency.setValueAtTime(f,t0);
    if(f2) o.frequency.exponentialRampToValueAtTime(f2,t0+d);
    g.gain.setValueAtTime(v||0.05,t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
    o.connect(g); g.connect(sfxBus||AC.destination); o.start(t0); o.stop(t0+d+0.03);
  }catch(e){}
}
function noiseHit(t0,dur,vol,hp,bus){
  if(!AC||!noiseBuf) return;
  try{
    const s=AC.createBufferSource(); s.buffer=noiseBuf;
    const f=AC.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp;
    const g=AC.createGain(); g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    s.connect(f); f.connect(g); g.connect(bus||sfxBus); s.start(t0); s.stop(t0+dur+0.02);
  }catch(e){}
}
/* ----- 맥주 따르는 소리: 대역통과 노이즈(쏴아) + 꼴깍 기포음. 유속·채워진 양에 따라 높아짐 ----- */
const PS=[];
function pourSnd(i,on,mult,fill,dt){
  if(!AC||!sfxBus||!noiseBuf) return;
  let p=PS[i];
  if(!p){
    if(!on) return;
    try{
      const src=AC.createBufferSource(); src.buffer=noiseBuf; src.loop=true;
      const f=AC.createBiquadFilter(); f.type='bandpass'; f.Q.value=0.9; f.frequency.value=1500;
      const gn=AC.createGain(); gn.gain.value=0;
      src.connect(f); f.connect(gn); gn.connect(sfxBus); src.start();
      p=PS[i]={src,f,gn,glug:0};
    }catch(e){return;}
  }
  const tt=AC.currentTime;
  if(on){
    p.f.frequency.setTargetAtTime(750+mult*320+fill*1500,tt,0.05);
    p.gn.gain.setTargetAtTime(0.07+mult*0.03,tt,0.03);
    p.src.playbackRate.setTargetAtTime(0.85+mult*0.12+fill*0.45,tt,0.05);
    p.glug-=dt;
    if(p.glug<=0){
      p.glug=rnd(0.07,0.16)/(0.6+mult*0.4);
      const f0=rnd(240,480)+fill*520; voice(f0,tt,0.06,'sine',0.045,sfxBus,f0*1.6);
    }
  } else p.gn.gain.setTargetAtTime(0,tt,0.04);
}
/* ----- 경쾌한 8비트 BGM (150BPM, C-Am-F-G, 4마디 루프) ----- */
const mf=n=>440*Math.pow(2,(n-69)/12);
const MEL=[
 76,0,79,0, 84,0,79,0, 76,0,79,76, 74,0,72,0,
 81,0,76,0, 72,0,76,0, 81,0,84,81, 79,0,76,0,
 77,0,81,0, 84,0,81,0, 77,0,81,77, 76,0,74,0,
 79,0,83,0, 86,0,83,0, 79,0,83,79, 77,74,71,0
];
const BASS=[48,45,41,43];
const CHORDS=[[60,64,67,72],[57,60,64,69],[53,57,60,65],[55,59,62,67]];
let musicRunning=false, musicStep=0, musicNext=0, musicTimer=null;
function musicDur(){ return 0.1/(1+Math.min(combo,8)*0.04+(typeof rush!=='undefined'&&rush?0.12:0)); }   // 콤보/러시아워일수록 빨라지는 BGM
function scheduleStep(step,t0,SD){
  const bar=(step>>4)&3, s=step&15; SD=SD||0.1;
  const m=MEL[step]; if(m) voice(mf(m),t0,SD*1.8,'square',0.075,musBus);
  if(s%2===0){ const r=BASS[bar]; voice(mf((s%4===0)?r:r+12),t0,SD*1.8,'triangle',0.17,musBus); }
  voice(mf(CHORDS[bar][s%4]+12),t0,SD*0.8,'square',0.022,musBus);
  if(s===0||s===8||(s===10&&(bar&1))) voice(150,t0,0.13,'sine',0.32,musBus,42);
  if(s===4||s===12) noiseHit(t0,0.11,0.16,1200,musBus);
  if(s%2===0) noiseHit(t0,0.035,(s%4===2)?0.07:0.04,6000,musBus);
}
function musicTick(){
  if(!AC||!musicRunning) return;
  const now=AC.currentTime;
  if(musicNext<now-0.3) musicNext=now+0.05;
  while(musicNext<now+0.3){ const d=musicDur(); scheduleStep(musicStep%64,musicNext,d); musicNext+=d; musicStep++; }
}
function startMusic(){
  if(!AC||!musBus) return;
  if(!musicRunning){ musicRunning=true; musicStep=0; musicNext=AC.currentTime+0.1; if(!musicTimer) musicTimer=setInterval(musicTick,50); }
  musBus.gain.setTargetAtTime(musicOn?0.5:0,AC.currentTime,0.05);
}
function stopMusic(){
  musicRunning=false;
  if(AC&&musBus) musBus.gain.setTargetAtTime(0,AC.currentTime,0.08);
}
function toggleMusic(){
  musicOn=!musicOn; try{localStorage.setItem('cp_music',musicOn?'1':'0');}catch(e){}
  initAudio(); if(AC&&musBus) musBus.gain.setTargetAtTime(musicOn?0.5:0,AC.currentTime,0.05);
}

/* ---------------- data ---------------- */
const DIFF=[
 {max:3,gap:2.6,pat:10,soju:0,milko:0,sojuT:0},
 {max:4,gap:2.1,pat:9,soju:0,milko:.30,sojuT:6.0},
 {max:4,gap:1.7,pat:8,soju:.20,milko:.15,sojuT:5.0}
];
const GOLD={beer:'#f0a800',hi:'#ffd45a',dk:'#c47a00',foam:'#ffffff',fd:'#dfe8ef',dark:false};
const DARKB={beer:'#1c0f08',hi:'#4a2f1c',dk:'#0a0503',foam:'#e2cba0',fd:'#bda070',dark:true};
const BEERS=[
 Object.assign({name:['IPA'],accent:'#8ff08f'},GOLD),
 Object.assign({name:['PORTER'],accent:'#e0a870'},DARKB),
 Object.assign({name:['PILSNER'],accent:'#ffe27a'},GOLD),
 Object.assign({name:['SOUR','ALE'],accent:'#ff8ab0'},GOLD)
];
let state='title', t=0, tips=0, lives=3, round=1, roundLeft=ROUND_T, spawnT=0, combo=0;
let rush=null, rushDone=false, comboSeen=0;
const PRO_LINES=['"오늘은 크래프트피피에서 일하는 날!"'], PRO_N=PRO_LINES.join('\n').length;
let proT=0, proTyped=0, proEnd=0;
function startPrologue(){ initAudio(); resetInputs(); state='prologue'; proT=0; proTyped=0; proEnd=0; }
function proSkipRect(){ return {x:W-47,y:Math.round(H*452/480),w:45,h:18}; }
function inProSkip(p){ const r=proSkipRect(); return p.x>=r.x-4&&p.x<=r.x+r.w+4&&p.y>=r.y-4&&p.y<=r.y+r.h+6; }
function updatePrologue(dt){
  proT+=dt;
  const n=clamp(Math.floor((proT-0.6)/0.08)+1,0,PRO_N);
  if(n>proTyped){
    const ch=PRO_LINES.join('\n')[n-1];
    if(ch!==' '&&ch!=='\n') tone(880+(n%3)*110,0.04,'square',0.03);
    proTyped=n;
  }
  if(proTyped>=PRO_N){ proEnd+=dt; if(proEnd>=1.5) startGame(); }
}
function korW(str,size){ const m=document.createElement('canvas').getContext('2d'); m.font='bold '+size+'px "Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR",sans-serif'; return Math.ceil(m.measureText(str).width); }
function drawPrologue(){
  ctx.imageSmoothingEnabled=false;
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  const top=Math.round(H*105/480), bot=Math.round(H*330/480), mh=bot-top;
  if(PRO.bg){
    const iw=PRO.bg.naturalWidth, ih=PRO.bg.naturalHeight, sh=Math.min(ih,iw*mh/W), sEnd=ih*0.76, sy=Math.max(0,sEnd-sh);   // 아래 도로(보도블록) 부분은 잘라냄
    ctx.drawImage(PRO.bg,0,sy,iw,sEnd-sy,0,top,W,mh);
  }
  if(SP.hero){
    const hh=SP.hero.h, hw=SP.hero.w, x=Math.round(-hw+proT*70), bob=Math.round(Math.abs(Math.sin(proT*9))*3);
    const feet=bot+6;      // 상반신이 화면 하단에 걸치고 하체는 아래 검은 레터박스에 가려짐
    ctx.drawImage(SP.hero.c,x,feet-hh-bob);
  }
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,top); ctx.fillRect(0,bot,W,H-bot);      // 레터박스 (이미지가 넘치면 가림)
  // 대사 상자: 게임보이 포켓몬 스타일 메시지 창 (흰 바탕 + 도트 모서리 + 이중선: 바깥 1px 얇게 / 안쪽 2px 두껍게)
  const bx=8, bw=W-16, by=bot+14, bh=50, INK='#181818', PAPER='#f4f4ec';
  R(bx,by,bw,bh,PAPER);
  R(bx,by,1,1,'#000'); R(bx+bw-1,by,1,1,'#000'); R(bx,by+bh-1,1,1,'#000'); R(bx+bw-1,by+bh-1,1,1,'#000');   // 모서리 도트 깎기
  R(bx+1,by+1,1,1,'#000'); R(bx+bw-2,by+1,1,1,'#000'); R(bx+1,by+bh-2,1,1,'#000'); R(bx+bw-2,by+bh-2,1,1,'#000');
  { const ox=bx+2, oy=by+2, ow=bw-4, oh=bh-4;           // 바깥 얇은 선 (모서리 한 칸씩 비움)
    R(ox+1,oy,ow-2,1,INK); R(ox+1,oy+oh-1,ow-2,1,INK); R(ox,oy+1,1,oh-2,INK); R(ox+ow-1,oy+1,1,oh-2,INK); }
  { const ix=bx+5, iy=by+5, iw2=bw-10, ih2=bh-10;       // 안쪽 두꺼운 선 (둥근 도트 모서리)
    R(ix+2,iy,iw2-4,2,INK); R(ix+2,iy+ih2-2,iw2-4,2,INK); R(ix,iy+2,2,ih2-4,INK); R(ix+iw2-2,iy+2,2,ih2-4,INK);
    R(ix+1,iy+1,1,1,INK); R(ix+iw2-2,iy+1,1,1,INK); R(ix+1,iy+ih2-2,1,1,INK); R(ix+iw2-2,iy+ih2-2,1,1,INK); }
  if(proTyped>=PRO_N&&Math.floor(t*3)%2){      // 다음으로 넘어가는 ▼ 표시
    const ax=bx+bw-18, ay=by+bh-17; R(ax,ay,7,1,INK); R(ax+1,ay+1,5,1,INK); R(ax+2,ay+2,3,1,INK); R(ax+3,ay+3,1,1,INK);
  }
  // 자막 타이핑
  let left=proTyped;
  PRO_LINES.forEach((ln,i)=>{
    const part=ln.slice(0,Math.max(0,Math.min(ln.length,left))); left-=ln.length+1;
    if(!part) return;
    const w=korW(ln,12), x0=Math.round((W-w)/2);
    korText(part,x0+Math.round(korW(part,12)/2),by+(bh>>1)-7,INK,12,'c');
  });
  // SKIP 버튼
  const r=proSkipRect();

const touchLane=new Map(), keyDown=[false,false,false,false];
let mouseLane=-1, lastTouch=-9999, iconT=-9999;
function laneActive(i){
  if(state!=='play') return false;
  if(keyDown[i]||mouseLane===i) return true;
  for(const v of touchLane.values()) if(v===i) return true;
  return false;
}
function ptOf(cx,cy){const r=cv.getBoundingClientRect(); return {x:(cx-r.left)/r.width*W,y:(cy-r.top)/r.height*H};}
function laneOfPoint(p){ if(p.y<TOP_H||p.x<0||p.x>=W) return -1; return clamp(Math.floor(p.x/LW),0,LANES-1); }
function syncTouches(e){
  const live=new Set(); for(const tt of e.touches) live.add(tt.identifier);
  for(const id of Array.from(touchLane.keys())) if(!live.has(id)) touchLane.delete(id);
}
function handleTap(){
  if(state==='title') startPrologue();
  else if((state==='over'||state==='clear')&&overT>1.1) startGame();
}
function sojuTap(l){
  if(state!=='play') return;
  if(hold&&hold<3&&holdCust&&holdCust.state==='wait') endHold();
  const mg=glasses[l];
  if(mg&&mg.kind==='milko'&&mg.state==='fill'&&mg.cust&&!mg.locked&&mg.cust.state==='wait'){
    mg.needRelease=false; mg.tapFlash=0.16; mg.taps=(mg.taps||0)+1; mg.beer=0; mg.foam=Math.min(1,mg.taps/10); mg.cust.shake=0.1;
    tone(700+mg.taps*50,0.05,'square',0.05,300); tone(200,0.05,'triangle',0.06,120,0.02);
    burst(mg.cust.x+rnd(-8,8),counterY-40,3,['#fff','#e8f4ff'],{sp:35,g:60,life:.3});
    if(mg.taps>=10){ mg.locked=true; judge(l); }
    return;
  }
}
function sojuHit(p){      // 소주 아저씨는 탭(레버)이 아니라 아저씨 본인을 직접 터치해야 반응
  if(state!=='play') return;
  const spr=SP.chars&&SP.chars.drunk, hw=(spr?spr.w:50)/2+6, hh=(spr?spr.h:70)+8;
  for(const c of customers) if(c.kind==='soju'&&c.state==='wait'){
    if(Math.abs(p.x-c.x)>hw||p.y<counterY+4-hh||p.y>counterY+4) continue;
    if(hold===3) endHold();
    c.taps++; c.shake=0.18;
    tone(880+c.taps*45,0.05,'square',0.05,300); tone(160,0.05,'triangle',0.07,90,0.02);
    burst(c.x+rnd(-8,8),counterY-40,4,['#fff','#ffe14a','#9be86a'],{sp:40,g:60,life:.35});
    if(c.taps>=10) sojuSuccess(c);
    break;
  }
}
document.addEventListener('touchstart',e=>{
  e.preventDefault(); lastTouch=performance.now();
  initAudio();
  for(const tt of e.changedTouches){
    const pp=ptOf(tt.clientX,tt.clientY);
    if(state==='prologue'){ if(inProSkip(pp)) startGame(); continue; }
    if(pp.x<28&&pp.y>=40&&pp.y<TOP_H){toggleMusic();iconT=performance.now();continue;}
    if(state==='play'){
      const l=laneOfPoint(pp);
      sojuHit(pp);
      if(l>=0){touchLane.set(tt.identifier,l); sojuTap(l);}
    }
  }
  syncTouches(e);
},{passive:false});

});

function keyLane(e){
  const m=/^(Digit|Numpad)([1-4])$/.exec(e.code||''); if(m) return +m[2]-1;
  if(e.key>='1'&&e.key<='4') return +e.key-1;
  return -1;
}
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&['+','-','=','0'].includes(e.key)) e.preventDefault();
  const l=keyLane(e);
  if(l>=0||e.code==='Space'||e.code==='Enter'){
    e.preventDefault(); initAudio();
    if(state!=='play'){ if(!e.repeat) handleTap(); return; }
    if(l>=0){ if(!e.repeat&&!keyDown[l]) sojuTap(l); keyDown[l]=true; }
  }
  if(e.key==='m'||e.key==='M') toggleMusic();
});

function layout(){
  tapTop=H-TAP_H; counterY=tapTop-CNT_H; baseY=counterY+2;
  grain=[]; let s=4242;
  const r=()=>{s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff;};
  for(let i=0;i<260;i++){
    grain.push({x:Math.floor(r()*W),y:TOP_H+4+Math.floor(r()*Math.max(1,counterY-TOP_H-8)),h:2+Math.floor(r()*6),k:r()<.5?0:1});
  }
}
function resize(){
  const vw=window.innerWidth, vh=window.innerHeight;
  if(vw/vh>0.62){ wrap.style.width=Math.round(vh*9/16)+'px'; wrap.style.height=vh+'px'; }
  else { wrap.style.width='100vw'; wrap.style.height=''; }
  const rc=wrap.getBoundingClientRect();
  const ww=rc.width||vw, wh=rc.height||vh;
  H=clamp(Math.round(W*wh/ww),400,540);
  cv.width=W; cv.height=H; ctx.imageSmoothingEnabled=false;
  layout();
}

/* ---------------- particles ---------------- */
function burst(x,y,n,cols,o){
  o=o||{};
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, sp=(o.sp||60)*(0.35+Math.random()*0.65);
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-(o.up||0),g:o.g==null?120:o.g,life:(o.life||.8)*(0.6+Math.random()*0.6),max:o.life||.8,col:pick(cols),sz:o.sz||2,star:!!o.star});
  }
}
function updateParts(dt){
  for(const p of parts){p.life-=dt;p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}
  parts=parts.filter(p=>p.life>0);
}
function drawParts(){
  for(const p of parts){
    ctx.globalAlpha=clamp(p.life/(p.max*0.5),0,1);
    if(p.star){R(p.x-2,p.y,5,1,p.col);R(p.x,p.y-2,1,5,p.col);R(p.x-1,p.y-1,3,3,'#fff');}
    else R(p.x,p.y,p.sz,p.sz,p.col);
  }
  ctx.globalAlpha=1;
}

function loadImg(src){return new Promise((ok,ng)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=ng;im.src=src;});}
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function sheetData(im){
  const c=mkCanvas(im.naturalWidth,im.naturalHeight), x=c.getContext('2d',{willReadFrequently:true});
  x.imageSmoothingEnabled=false; x.drawImage(im,0,0);
  return {c,x,w:c.width,h:c.height,d:x.getImageData(0,0,c.width,c.height)};
}
/* 이미지 외곽(0,0)과 연결된 순수 흰색(R,G,B>240)만 Flood Fill → alpha 0. 내부 흰색(눈동자/메리야스/거품)은 보존 */
function floodWhiteBg(S){
  const p=S.d.data,w=S.w,h=S.h,n=w*h;
  const white=i=>p[i*4]>240&&p[i*4+1]>240&&p[i*4+2]>240;
  if(!white(0)) return;
  const seen=new Uint8Array(n), stack=new Int32Array(n); let sp=0;
  seen[0]=1; stack[sp++]=0;
  while(sp>0){
    const i=stack[--sp]; p[i*4+3]=0;
    const x=i%w; let j;
    if(x>0){j=i-1; if(!seen[j]&&white(j)){seen[j]=1;stack[sp++]=j;}}
    if(x<w-1){j=i+1; if(!seen[j]&&white(j)){seen[j]=1;stack[sp++]=j;}}
    if(i>=w){j=i-w; if(!seen[j]&&white(j)){seen[j]=1;stack[sp++]=j;}}
    if(i<n-w){j=i+w; if(!seen[j]&&white(j)){seen[j]=1;stack[sp++]=j;}}
  }
  /* JPEG 후광(외곽과 맞닿은 밝은 1px) 정리 */
  const kill=[];
  for(let i=0;i<n;i++){
    if(p[i*4+3]===0) continue;
    if(Math.min(p[i*4],p[i*4+1],p[i*4+2])<226) continue;
    const x=i%w;
    if((x>0&&p[(i-1)*4+3]===0)||(x<w-1&&p[(i+1)*4+3]===0)||(i>=w&&p[(i-w)*4+3]===0)||(i<n-w&&p[(i+w)*4+3]===0)) kill.push(i);
  }
  for(const i of kill) p[i*4+3]=0;
}
/* 빈 파인트 잔의 유리 내부(밝은 흰색)를 투명화 → 액체를 아래에 깔고 유리 윤곽/하이라이트를 위에 겹쳐 그림 */
function clearGlassInterior(S,x0,y0,x1,y1){
  const p=S.d.data,w=S.w;
  for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++){
    const i=(y*w+x)*4;
    if(p[i+3]&&p[i]>=236&&p[i+1]>=236&&p[i+2]>=236) p[i+3]=0;
  }
}
/* 탭 레버(빨간 손잡이)를 분리: 레버 이미지 + 레버가 빠진 몸통 */
function splitLever(S){
  const p=S.d.data,w=S.w,X0=LEV.x0,X1=LEV.x1,Y0=LEV.y0,Y1=LEV.y1,lw=X1-X0+1,lh=Y1-Y0+1;
  const lv=new ImageData(lw,lh);
  const isRed=i=>p[i]>110&&p[i]>p[i+1]*1.7&&p[i]>p[i+2]*1.5;
  let pmn=-1,pmx=-1;
  for(let y=Y0;y<=Y1;y++){
    let mn=1e9,mx=-1;
    for(let x=X0;x<=X1;x++){const i=(y*w+x)*4; if(p[i+3]&&isRed(i)){if(x<mn)mn=x;if(x>mx)mx=x;}}
    if(mx<0){ if(pmn<0) continue; mn=pmn; mx=pmx; }
    pmn=mn; pmx=mx;
    const fx=Math.max(X0-2,mn-10);
    for(let x=Math.max(X0,mn-6);x<=Math.min(X1,mx+6);x++){
      const i=(y*w+x)*4; if(!p[i+3]) continue;
      const lum=.3*p[i]+.59*p[i+1]+.11*p[i+2];
      if(isRed(i)||lum<95){
        const j=((y-Y0)*lw+(x-X0))*4;
        lv.data[j]=p[i];lv.data[j+1]=p[i+1];lv.data[j+2]=p[i+2];lv.data[j+3]=255;
        if(y<90){p[i+3]=0;}
        else{const k=(y*w+fx)*4;p[i]=p[k];p[i+1]=p[k+1];p[i+2]=p[k+2];p[i+3]=255;}
      }
    }
  }
  const c=mkCanvas(lw,lh); c.getContext('2d').putImageData(lv,0,0);
  return c;
}
/* 스무딩 켠 오프스크린에서 축소 → 알파 이진화(가장자리 또렷) → 게임에서는 smoothing off 로 1:1 출력 */
function cutFrom(src,sx,sy,sw,sh,scale){
  const tw=Math.max(1,Math.round(sw*scale)), th=Math.max(1,Math.round(sh*scale));
  const c=mkCanvas(tw,th), x=c.getContext('2d',{willReadFrequently:true});
  x.imageSmoothingEnabled=true; x.imageSmoothingQuality='high';
  x.drawImage(src,sx,sy,sw,sh,0,0,tw,th);
  const id=x.getImageData(0,0,tw,th), d=id.data;
  for(let i=3;i<d.length;i+=4) d[i]=d[i]>=110?255:0;
  x.putImageData(id,0,0);
  return {c,w:tw,h:th};
}
function tintSprite(s,col,a){
  const c=mkCanvas(s.w,s.h),x=c.getContext('2d');
  x.drawImage(s.c,0,0); x.globalCompositeOperation='source-atop'; x.globalAlpha=a; x.fillStyle=col; x.fillRect(0,0,s.w,s.h);
  return {c,w:s.w,h:s.h};
}
/* 빈 잔 스프라이트에서 행별 내부(투명) 영역 계산 */
function glassMask(s){
  const {c,w,h}=s, d=c.getContext('2d').getImageData(0,0,w,h).data, cx=w>>1;
  const L=new Int16Array(h).fill(-1), Rr=new Int16Array(h).fill(-1);
  let yTop=-1,yBot=-1;
  for(let y=0;y<h;y++){
    if(d[(y*w+cx)*4+3]!==0) continue;
    let l=cx; while(l>0&&d[(y*w+l-1)*4+3]===0) l--;
    let r=cx; while(r<w-1&&d[(y*w+r+1)*4+3]===0) r++;
    if(l===0||r===w-1) continue;
    L[y]=l; Rr[y]=r; if(yTop<0) yTop=y; yBot=y;
  }
  for(let y=yTop+1;y<=yBot;y++) if(L[y]<0){L[y]=L[y-1];Rr[y]=Rr[y-1];}
  s.L=L; s.R=Rr; s.yTop=yTop; s.yBot=yBot; s.IH=yBot-yTop+1;
}
async function buildSprites(){
  const [i1,i2,i3,i4]=await Promise.all([loadImg(IMG_CHARS),loadImg(IMG_TAPS),loadImg(IMG_DUO),loadImg(IMG_HERO)]);
  const S1=sheetData(i1), S2=sheetData(i2), S3=sheetData(i3), S4=sheetData(i4);
  floodWhiteBg(S1); floodWhiteBg(S2); floodWhiteBg(S3); floodWhiteBg(S4);
  const levSrc=splitLever(S2);
  clearGlassInterior(S2,30,508,157,735);   /* 황금 빈 잔 */
  clearGlassInterior(S2,30,909,153,1134);  /* 흑맥주 빈 잔 */
  S1.x.putImageData(S1.d,0,0); S2.x.putImageData(S2.d,0,0);
  for(const k in CROP_CH){
    const r=CROP_CH[k], s=cutFrom(S1.c,r[0],r[1],r[2]-r[0]+1,r[3]-r[1]+1,CH_SCALE);
    s.cA=tintSprite(s,'#ff2a1a',0.38).c; s.cH=tintSprite(s,'#ffffff',0.5).c;
    SP.chars[k]=s;
  }
  /* 어깨동무 투샷: 외곽 흰 배경 Flood Fill 후 내용 영역만 잘라 1인 캐릭터 폭의 1.7배로 축소 */
  S3.x.putImageData(S3.d,0,0);
  { const d=S3.d.data,w=S3.w,h=S3.h; let x0=w,y0=h,x1=-1,y1=-1;
    for(let y=0;y<h;y++) for(let x=0;x<w;x++) if(d[(y*w+x)*4+3]){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
    const bw=x1-x0+1, bh=y1-y0+1, sc=(SP.chars.drunk.w*1.7)/bw;
    SP.duo=cutFrom(S3.c,x0,y0,bw,bh,sc); }
  /* 프롤로그 주인공: 외곽 흰 배경 Flood Fill 후 내용 영역만 잘라 높이 80으로 축소 */
  S4.x.putImageData(S4.d,0,0);
  { const d=S4.d.data,w=S4.w,h=S4.h; let x0=w,y0=h,x1=-1,y1=-1;
    for(let y=0;y<h;y++) for(let x=0;x<w;x++) if(d[(y*w+x)*4+3]){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
    SP.hero=cutFrom(S4.c,x0,y0,x1-x0+1,y1-y0+1,92/(y1-y0+1)); }
  const T=TAP_SRC;
  SP.tap=cutFrom(S2.c,T.x0,T.y0,T.x1-T.x0+1,T.y1-T.y0+1,TAP_SCALE);
  const lv=cutFrom(levSrc,0,0,levSrc.width,levSrc.height,TAP_SCALE);
  lv.ox=Math.round((LEV.x0-T.x0)*TAP_SCALE); lv.oy=Math.round((LEV.y0-T.y0)*TAP_SCALE);
  SP.lever=lv;
  SP.nicheFloor=Math.round((T.nicheFloor-T.y0)*TAP_SCALE); SP.spoutY=Math.round((T.spout-T.y0)*TAP_SCALE);
  SP.gl.gold={empty:cutFrom(S2.c,30,508,128,228,GL_SCALE),over:cutFrom(S2.c,550,510,133,226,GL_SCALE)};
  SP.gl.dark={empty:cutFrom(S2.c,30,909,124,226,GL_SCALE),over:cutFrom(S2.c,555,904,123,231,GL_SCALE)};
  glassMask(SP.gl.gold.empty); glassMask(SP.gl.dark.empty);
  SP.str.gold=cutFrom(S2.c,783,452,33,188,GL_SCALE);  SP.spl.gold=cutFrom(S2.c,727,640,142,98,SPL_SCALE);
  SP.str.dark=cutFrom(S2.c,785,853,29,185,GL_SCALE);  SP.spl.dark=cutFrom(S2.c,729,1038,137,97,SPL_SCALE);
  for(const k of ['gold','dark']){ const s=SP.spl[k]; const c=mkCanvas(s.w,s.h),x=c.getContext('2d'); x.translate(s.w,0);x.scale(-1,1);x.drawImage(s.c,0,0); s.flip=c; }
  SP.ready=true;
}
buildSprites().catch(e=>{SP.failed=true; try{console.error(e);}catch(_){}});

  for(let r=0;r<h;r++){const hw=(w>>1)-Math.floor(r*2/h); R(x+(w>>1)-hw-1,y+r,hw*2+2,1,'#000');}
  for(let r=0;r<h;r++){const hw=(w>>1)-Math.floor(r*2/h)-1; R(x+(w>>1)-hw,y+r,hw*2,1,r<4?foam:(foamOnly?foam:col));}
  R(x+2,y+3,1,h-6,'rgba(255,255,255,.7)');
}

function drawCustomer(c){

    const k=Math.floor(t*6)%2;
    if(c.duoY<D.h*0.5) for(let i=-1;i<=1;i++){ const px=dx+i*16, py=y-8+(((i+k)&1)?-2:0); R(px-1,py,3,1,'#ff6a9a');R(px,py-1,1,3,'#ff6a9a');}

  const spr=SP.chars[c.sp]; if(!spr) return;

function drawFill(gx,gy,E,g,B){
  const IH=E.IH;
  const hB=Math.min(IH,Math.round(g.beer*IH));
  const hF=Math.max(0,Math.min(IH-hB,Math.round(g.foam*IH)));
  const tk=(t*8)|0;
  for(let k=0;k<hB;k++){
    const y=E.yBot-k, l=E.L[y], r=E.R[y]; if(l<0) continue; const w=r-l+1;
    R(gx+l,gy+y,w,1,k<2?B.dk:B.beer);
    if(w>6){R(gx+l,gy+y,2,1,B.hi);R(gx+r-1,gy+y,2,1,B.dk);}
    if(((k*7+tk)%13)===0&&w>10) R(gx+l+3+(k%4)*3,gy+y,1,1,B.hi);
  }
  for(let k=hB;k<hB+hF;k++){
    const y=E.yBot-k, l=E.L[y], r=E.R[y]; if(l<0) continue; const w=r-l+1;
    R(gx+l,gy+y,w,1,B.foam);
    if(w>6) R(gx+r-1,gy+y,2,1,B.fd);
    if(((k*5+3)%4)===0&&w>10) R(gx+l+2+((k*3)%Math.max(1,w-5)),gy+y,1,1,B.fd);
  }
  if(hB>8) for(let n=0;n<7;n++){
    const k=((t*(7+n*1.7)+n*9)%(hB-3))|0, y=E.yBot-1-k, l=E.L[y], r=E.R[y]; if(l<0) continue;
    R(gx+l+3+((n*7)%Math.max(1,r-l-5)),gy+y,1,1,B.hi);
  }
  if(hF>0){
    const top=E.yBot-(hB+hF);
    if(top>=E.yTop-1){
      const y=Math.max(E.yTop,top), l=E.L[y], r=E.R[y];
      if(l>=0){ R(gx+l+1,gy+top,r-l-1,1,B.foam); R(gx+l+3,gy+top-1,r-l-5,1,B.foam); }
    }
  }
}

function spawn(lane,kind){
  const free=[0,1,2,3].filter(l=>!customers.some(c=>c.lane===l));
  if(lane==null){ if(!free.length) return; lane=pick(free); }
  else if(!free.includes(lane)) return;
  const D=DIFF[round-1];
  if(!kind){
    kind='beer';
    if(round>=2){
      const hasSoju=customers.some(c=>c.kind==='soju');

    }
  }

    const used=customers.map(c=>c.sp);

    if(Math.random()<0.8&&krFree.length) sp=pick(krFree);
    else if(foFree.length) sp='foreign';
    else if(krFree.length) sp=pick(krFree);
    else return;
  }
  const entry=lane<2?1:-1;
  customers.push({lane,kind,x:entry>0?-30:W+30,tx:lane*LW+30,dir:entry,state:'walkin',t:Math.random()*2,timer:0,patience:0,pmax:1,
    sp,flip:Math.random()<0.5,expr:'wait',taps:0,shake:0,buddy:null});
}

    return;
  }
  c.pmax=c.patience=D.pat*(0.85+Math.random()*0.3);
  Object.assign(g,{state:'fill',kind:c.kind,beer:0,foam:0,pressT:0,pressBeer:0,pressFoam:0,locked:false,wasPouring:false,idleT:0,taps:0,st:0,tick:0,hp:0,cust:c,
    mult:2+3*Math.pow(Math.random(),1.25),needRelease:laneActive(c.lane)});
  tone(1320,0.08,'square',0.03);
}
function timeout(c){
  c.state='angry'; c.timer=0.8; c.expr='angry';
  const g=glasses[c.lane];
  if(c.kind==='soju'){
    lives--; ST.bad++; shakeT=0.35; combo=0; floater(c.x,baseY-100,'BAD','#ff3b30',2);
    tone(130,0.4,'sawtooth',0.06,50);
    if(lives<=0) finish('over');
    return;
  }
  if(g.cust===c){g.state='slide';g.st=0;g.locked=true;}
  ST.miss++; floater(c.x,baseY-86,'BYE','#ff8a3d');
  tone(220,0.2,'square',0.04,110);
}
function addSale(v){tips+=v; lastTip=v; lastTipT=2.2;}
function fireworks(x,y,closeness){
  const n=16+Math.round(closeness*closeness*44);
  const cols=['#ff4a6a','#ffd23f','#5ef2ff','#7cff7c','#ff9aff','#ffffff'];
  burst(x,y,n,cols,{sp:70+closeness*70,g:90,life:1.0,sz:3});
  burst(x,y,6+Math.round(closeness*10),cols,{sp:50+closeness*50,g:30,life:1.0,star:true});
  if(closeness>0.6){burst(x-26,y+10,10,cols,{sp:60,g:90,life:.9});burst(x+26,y+10,10,cols,{sp:60,g:90,life:.9});}
}
function judge(i,forceBad){
  const g=glasses[i], c=g.cust; if(!c) return;
  const total=g.beer+g.foam, bshare=g.beer/Math.max(0.0001,total);
  let res, pay=0, label, col;
  const SERVE_PAY=7000;   // 서브 기본 매출 (BAD 제외)
  if(total>=0.90) res='PERFECT'; else if(total>=0.80) res='GOOD'; else if(total>0.50) res='SOSO'; else res='BAD';
  if(forceBad) res='BAD';
  servedOnce=true;
  if(rush){ rush.n++; if(res!=='PERFECT') rush.bad=true; }
  let wrong=false;
  if(g.kind==='milko'&&bshare>0.25&&(res==='PERFECT'||res==='GOOD')){res='SOSO';wrong=true;}
  const hx=c.x, hy=baseY-60;
  if(res==='PERFECT'){
    combo++; { const cb=Math.min(2500,(combo-1)*500); ST.perf++; ST.perfB+=2000; ST.comboB+=cb; ST.maxC=Math.max(ST.maxC,combo); pay=SERVE_PAY+2000+cb; } label='PERFECT!'; col='#7cff7c';
    const cl=clamp((total-0.90)/0.10,0,1);
    fireworks(hx,hy,cl); flashT=0.18+cl*0.15; flashCol='#ffe9a0';
    tone(660,0.08,'square',0.05,null,0);tone(880,0.08,'square',0.05,null,0.08);tone(1175,0.12,'square',0.05,null,0.16);tone(1568,0.2,'square',0.05,null,0.26);
    c.expr='happy';
  } else if(res==='GOOD'){
    combo=0; ST.good++; ST.goodB+=1000; pay=SERVE_PAY+1000; label='GOOD'; col='#ffe27a'; c.expr='happy';
    burst(hx,hy,10,['#ffe27a','#ffffff'],{sp:50,g:80,life:.6});
    tone(660,0.08,'square',0.05,null,0);tone(880,0.12,'square',0.05,null,0.08);
  } else if(res==='SOSO'){
    combo=0; ST.soso++; pay=SERVE_PAY; label=wrong?'NOT MILKO':'SO-SO'; col='#cfd6e0'; c.expr='meh';
    tone(330,0.15,'square',0.04,260);
  } else {
    combo=0; lives--; ST.bad++; shakeT=0.35; label='BAD'; col='#ff3b30'; c.expr='angry';
    tone(130,0.4,'sawtooth',0.06,50);
  }
  if(pay>0){ addSale(pay); const ix=g.kind==='milko'?4:i; ST.cups[ix]++; ST.base[ix]+=SERVE_PAY; }
  floater(hx,baseY-96,label,col,1);
  if(pay>0) floater(hx,baseY-108,'+'+fmt(pay),'#ffd700',1);
  c.state=(res==='BAD')?'angry':'served'; c.timer=res==='BAD'?0.9:1.1;
  g.locked=true; g.state='slide'; g.st=0;
  if(lives<=0) finish('over');
}
function overflow(g,c){
  const hx=c.x;
  g.state='spill'; g.st=0; g.locked=true; lives--; ST.bad++; shakeT=0.35; combo=0;
  c.state='angry'; c.timer=0.9; c.expr='angry';
  floater(hx,baseY-96,'BAD','#ff3b30',1); floater(hx,baseY-108,'OVERFLOW!','#ff8a3d',1);
  tone(130,0.4,'sawtooth',0.06,50);
  if(lives<=0) finish('over');
}
function sojuSuccess(c){
  const pay=2000; addSale(pay); ST.soju++; ST.sojuB+=pay;
  c.state='duo'; c.expr='happy'; c.timer=0; c.shake=0; c.duoY=0; c.buddy=null;   // 어깨동무 투샷으로 즉시 교체
  floater(c.x,baseY-100,'GREAT!','#7cff7c',1); floater(c.x,baseY-112,'+'+fmt(pay),'#ffd700',1);
  fireworks(c.x,baseY-70,0.5); flashT=0.2; flashCol='#c8ffc0';
  tone(784,0.08,'square',0.05,null,0);tone(988,0.08,'square',0.05,null,0.08);tone(1319,0.2,'square',0.05,null,0.16);
}
function updateGlass(i,dt){
  const g=glasses[i], on=laneActive(i);
  if(!on) g.needRelease=false;
  if(g.hp>0) g.hp-=dt;
  if(g.tapFlash>0) g.tapFlash-=dt;
  const canPour=g.state==='fill'&&!g.locked&&g.cust&&state==='play';
  const isMilko=g.kind==='milko';
  if(isMilko&&canPour&&on&&!g.needRelease){      // 밀코는 탭 전용: 길게 누르면 BAD
    g.holdT=(g.holdT||0)+dt; g.tapFlash=0.1;
    if(g.holdT>0.4){ g.locked=true; g.holdT=0; judge(i,true); }
  } else g.holdT=0;
  const pouring=canPour&&on&&!g.needRelease&&!isMilko;
  lever[i]+=(((pouring||(isMilko&&canPour&&on))?1:0)-lever[i])*Math.min(1,dt*18);
  pourSnd(i,pouring,g.mult,g.beer+g.foam,dt);
  if(g.state==='fill'&&g.cust){
    if(pouring){
      if(g.pressT===0){ g.pressBeer=0; g.pressFoam=0; g.idleT=0; if(g.mult>=3) g.hp=0.5; }
      g.pressT+=dt;
      const q=BASE_RATE*g.mult*dt;
      g.beer+=q*0.7; g.foam+=q*0.3; g.pressBeer+=q*0.7; g.pressFoam+=q*0.3;
      if(g.beer+g.foam>1.0){
        const k=1/(g.beer+g.foam); g.beer*=k; g.foam*=k; overflow(g,g.cust); g.wasPouring=false; return;
      }
    } else if(g.wasPouring){
      // 손을 뗀 순간
      if(g.pressT<FOAM_BURST){ g.foam+=g.pressBeer; g.beer-=g.pressBeer; if(g.beer<0)g.beer=0; }
      g.pressT=0; g.pressBeer=0; g.pressFoam=0;
      if(g.kind==='beer'){ g.locked=true; judge(i); }
      else g.idleT=0;
    }
    if(false){
      g.idleT+=dt; if(g.idleT>=MILKO_WAIT){ g.locked=true; judge(i); }
    }
  } else if(g.state==='slide'){
    g.st+=dt/0.5; if(g.st>=1){g.state='idle';g.cust=null;}
  } else if(g.state==='spill'){
    g.st+=dt/0.8; if(g.st>=1){g.state='idle';g.cust=null;g.beer=g.foam=0;}
  }
  g.wasPouring=pouring;
}
function update(dt){
  t+=dt;
  if(state==='prologue'){ updatePrologue(dt); return; }
  if(lastTipT>0) lastTipT-=dt;
  if(shakeT>0) shakeT-=dt;
  if(bannerT>0) bannerT-=dt;
  if(flashT>0) flashT-=dt;
  if(state!=='title') overT+=dt;
  for(const f of floaters){f.life-=dt;f.y-=14*dt;}
  floaters=floaters.filter(f=>f.life>0);
  updateParts(dt);
  if(state==='play'){
    if(pendingTut&&bannerT<=0) spawnTutorial();
    if(!hold&&roundLeft>0) roundLeft=Math.max(0,roundLeft-dt);
    if(!rushDone&&!rush&&roundLeft<=24&&roundLeft>12) startRush();
    if(rush){ rush.t+=dt; if(rush.t>=rush.dur) endRush(); }
    if(combo>comboSeen&&[3,5,8,10,15].includes(combo)){ floater(W/2,TOP_H+30,combo>=8?'UNSTOPPABLE! x'+combo:(combo>=5?'ON FIRE! x'+combo:'COMBO x'+combo),combo>=8?'#ff66d0':'#ff9a3a',2); tone(660+combo*30,0.08,'square',0.05,null,0);tone(990+combo*30,0.12,'square',0.05,null,0.08); }
    if(combo>comboSeen&&combo%5===0&&lives<3){ lives++; floater(W/2,TOP_H+46,'LIFE +1','#ff6a9a',2); fireworks(W/2,TOP_H+50,0.4);
      tone(880,0.08,'square',0.05,null,0.1);tone(1175,0.08,'square',0.05,null,0.18);tone(1568,0.2,'square',0.05,null,0.26); }
    if(!hold){ if(hintS.c) hintS.t+=dt; if(hintM.c) hintM.t+=dt; }
    comboSeen=combo;
    if(roundLeft<=0&&!pendingTut&&!customers.some(c=>c.state!=='leaving')) nextRound();      // 라운드 종료: 남은 손님이 모두 끝난 뒤 다음 라운드
  }
  if(state==='play'){
    const D=DIFF[round-1]; if(!hold) spawnT-=dt;
    if(!hold&&roundLeft>SPAWN_CUTOFF&&customers.length<(rush?4:D.max)&&spawnT<=0){
      spawn(); spawnT=D.gap*(rush?0.4:1)*(0.7+Math.random()*0.6);
      if(customers.length===0) spawnT=0.5;
    }
  }
  if(state!=='title'){
    for(const c of customers){
      c.t+=dt; if(c.shake>0) c.shake-=dt;
      if(c.state==='walkin'){
        const d=c.tx-c.x, step=75*dt;
        if(Math.abs(d)<=step){c.x=c.tx;arrive(c);} else c.x+=Math.sign(d)*step;
      } else if(c.state==='wait'){
        if(state==='play'&&!hold){c.patience-=dt; if(c.patience<=0) timeout(c);}
      } else if(c.state==='served'||c.state==='angry'){
        c.timer-=dt; if(c.timer<=0) c.state='leaving';
      } else if(c.state==='leaving'){
        c.x-=c.dir*95*dt;
      } else if(c.state==='duo'){
        c.duoY+=20*dt;      // 바 카운터 뒤로 천천히 내려가며 퇴장
        if(Math.floor(t*8)%2===0&&Math.random()<0.15) burst(c.x,counterY-SP.duo.h+c.duoY,1,['#ff6a9a','#ffe27a'],{sp:20,g:-20,life:.6});
      }
    }
    customers=customers.filter(c=>{
      if(c.state==='leaving') return !(c.x<-34||c.x>W+34);
      if(c.state==='duo') return c.duoY<SP.duo.h+6;
      return true;
    });
    for(let i=0;i<LANES;i++) updateGlass(i,dt);
  }
}
function render(){
  if(state==='prologue'){ drawPrologue(); return; }
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  ctx.save();
  if(shakeT>0) ctx.translate(Math.round((Math.random()-0.5)*5),Math.round((Math.random()-0.5)*5));
  drawWall();
  for(const c of customers) drawCustomer(c);
  if(!SP.ready){ ctx.restore(); drawHudBand(); textO(SP.failed?'IMAGE ERROR':'LOADING...',W/2,H/2,'#ffd23f','#000',2,'c'); return; }
  drawCounter();
  R(0,tapTop,W,TAP_H,'#26170f');
  for(let i=0;i<LANES;i++) drawLane(i);
  drawParts(); drawFloaters();
  drawHUD();
  drawOverlay();
  ctx.restore();
}
let last=0;
function loop(ts){
  const dt=Math.min(0.05,Math.max(0,(ts-last)/1000)); last=ts;
  update(dt); render();
  requestAnimationFrame(loop);
}
resize();
if(window.__CP_TEST) window.__CP_TEST({glasses,get customers(){return customers;},get state(){return state;},get lives(){return lives;},get tips(){return tips;},get combo(){return combo;},
  spawn,setRound(r){round=r;},startRush,setCombo(n){combo=n;},get rush(){return rush;},endHold,nextRound,finish,get ST(){return ST;},addSale,setRoundLeft(v){roundLeft=v;},get SP(){return SP;},get hold(){return hold;},get roundLeft(){return roundLeft;},setSpawnOff(){spawnT=1e9;},setMult(i,m){glasses[i].mult=m;},get round(){return round;}});
requestAnimationFrame(ts=>{last=ts;loop(ts);});
})();
</script>
